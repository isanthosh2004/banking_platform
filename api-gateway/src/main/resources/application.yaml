server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # 🔐 AUTH SERVICE
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # 🏦 ACCOUNT SERVICE
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/accounts/**
